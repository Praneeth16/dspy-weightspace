[project]
name = "dspy-weightspace"
version = "0.1.0"
description = "Weight-space programming as a DSPy optimizer: a frontier LM reads and patches a small local model's weights."
authors = [{ name = "Praneeth Paikray" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.0",
    "databricks-sdk>=0.60",
    "datasets>=3.0",
    "dspy==3.4.1",
    "gepa==0.1.4",
    "mlflow>=3.0",
    "numpy>=2.4.6",
    "openai>=2.54.0",
    "safetensors>=0.5",
    "torch>=2.6",
    "transformers>=4.57",
]

[tool.uv.build-backend]
module-name = "dspy_weightspace"
module-root = ""

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["F821", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]
